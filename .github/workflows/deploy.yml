name: Deploy to GitHub Pages

# Builds the app and publishes it every time main gets a new commit.
# Nothing to configure beyond turning on Pages in the repo settings
# (Settings -> Pages -> Source -> GitHub Actions) - the base-href is
# worked out automatically from the repo name below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - name: Work out the base href from the repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Build for production
        run: npx ng build --base-href "/${{ steps.repo.outputs.name }}/"

      # GitHub Pages has no server-side rewrites, so a deep link like
      # /pokedex or a browser refresh on /feedback would normally 404.
      # Copying index.html to 404.html is the standard workaround: Pages
      # serves it for any unknown path, and Angular's router takes it
      # from there.
      - name: Add SPA fallback for client-side routing
        run: cp dist/poke-finder/browser/index.html dist/poke-finder/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/poke-finder/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
